<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPGoose Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-icon">◯</span>
          <span class="brand-name">LPGoose</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="bot-pill" id="bot-pill">
          <span class="bot-dot" id="bot-dot"></span>
          <span id="bot-text">Bot running</span>
        </div>
        <div class="balance-pill" id="balance-pill">— SOL</div>
      </div>
    </header>
    <main id="main-content"></main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
